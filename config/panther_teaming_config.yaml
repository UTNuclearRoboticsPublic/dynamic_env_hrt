### CONTROL
/joy_node_teammate:
  ros__parameters:
    dev: /dev/input/js0
    deadzone: 0.1
    autorepeat_rate: 20.

/teammate_joy_button_mapper_node:
  ros__parameters:
    input_topic: '/joy_teammate'
    button_indices: [0,1,2,3]
    output_topics: ['/teammate_estop','/teammate_estop','/teammate_estop','/teammate_estop']

/joy_node_supervisor:
  ros__parameters:
    dev: /dev/input/js1
    deadzone: 0.1
    autorepeat_rate: 20.


